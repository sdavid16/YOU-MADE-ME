<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070d">
  <meta name="description" content="YOU MADE ME — un juego sobre provocar a una IA que aprende tus hábitos.">
  <title>YOU MADE ME</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script defer src="src/core/util.js"></script>
  <script defer src="src/core/events.js"></script>
  <script defer src="src/core/input.js"></script>
  <script defer src="src/core/audio.js"></script>
  <script defer src="src/game/levels.js"></script>
  <script defer src="src/game/ai.js"></script>
  <script defer src="src/game/particles.js"></script>
  <script defer src="src/game/renderer.js"></script>
  <script defer src="src/ui/hud.js"></script>
  <script defer src="src/game/game.js"></script>
  <script defer src="src/main.js"></script>
</head>
<body>
  <main id="game-shell" aria-label="YOU MADE ME videojuego">
    <div class="game-stage" id="game-stage">
      <canvas id="game" width="1000" height="620" tabindex="0" aria-label="Juego. Pulsa Enter para comenzar." role="application"></canvas>
      <div class="stage-grain" aria-hidden="true"></div>
      <button id="start-button" class="start-prompt" type="button"><span class="prompt-key">ENTER</span><span>COMENZAR SESIÓN</span></button>
      <button id="taunt-button" class="taunt-prompt hidden" type="button" title="Provoca a la IA"><span class="prompt-key">T</span><span>BURLARSE</span></button>\n      <button id="challenge-button" class="challenge-prompt hidden" type="button" title="Desafío de alto riesgo"><span class="prompt-key">G</span><span>DESAFIAR</span></button>
      <div id="toast" class="game-toast" role="status" aria-live="polite"></div>
      <div id="pause-screen" class="pause-screen hidden" role="dialog" aria-modal="true" aria-label="Juego en pausa">
        <div class="pause-card"><p class="menu-kicker">EJECUCIÓN SUSPENDIDA</p><h2>PAUSA</h2><p>Hasta los errores merecen un respiro.</p><button id="resume-button" class="menu-button" type="button">CONTINUAR <span>↵</span></button><button id="restart-button" class="menu-button muted-button" type="button">REINICIAR SESIÓN <span>R</span></button><p class="pause-foot">ESC PARA VOLVER</p></div>
      </div>
    </div>
    <nav class="game-tools" aria-label="Opciones">
      <button id="audio-button" class="tool-button" type="button" title="Silenciar sonido" aria-label="Silenciar sonido">♪</button>
      <button id="fullscreen-button" class="tool-button" type="button" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
      <button id="quick-restart" class="tool-button" type="button" title="Reiniciar sesión" aria-label="Reiniciar sesión">↻</button>
    </nav>
    <div class="corner-title" aria-hidden="true"><span class="corner-mark">Y</span><span>YOU MADE ME<small>THE PLAYER IS THE VARIABLE</small></span></div>
    <div class="edge-label left-edge" aria-hidden="true">SIMULATION / NO. 001</div>
    <div class="edge-label right-edge" aria-hidden="true">DO NOT TRUST THE SILENCE</div>
  </main>
  <div class="sr-only" aria-hidden="true">
    <span id="frame-world">SYSTEM / TITLE SCREEN</span><span id="frame-hint">PULSA INICIAR PARA EMPEZAR</span><span id="controls-copy"></span>
    <span id="world-title"></span><span id="chapter-pill"></span><span id="world-description"></span>
    <span id="provocation-value">00</span><span id="provocation-meter"></span><span id="provocation-caption"></span>
    <span id="adaptation-value">00%</span><span id="adaptation-meter"></span><span id="adaptation-caption"></span>
    <span id="ai-avatar"><span>?</span><i></i></span><span id="ai-state"></span><span id="ai-status-line"></span><span id="status-led"></span>
    <div id="log-entries"></div><p id="action-copy"></p>
  </div>
  <noscript><div class="noscript">YOU MADE ME necesita JavaScript activado.</div></noscript>
</body>
</html>
